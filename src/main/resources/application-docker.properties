# Settings used only when the app runs in Docker Compose
# (activated by SPRING_PROFILES_ACTIVE=docker in docker-compose.yml)

# Turn the database back on (application.properties switches it off for local runs and tests)
spring.autoconfigure.exclude=

# Connection details come from environment variables in docker-compose.yml
spring.jpa.hibernate.ddl-auto=update

# Show the database status at http://localhost:8080/actuator/health
management.endpoint.health.show-details=always
